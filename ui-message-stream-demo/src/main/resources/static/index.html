<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ui-message-stream demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e9ef; --dim:#8b93a7;
          --accent:#4f8cff; --green:#34c98e; --red:#ef5b6e; --amber:#f0b440; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .hint { color:var(--dim); font-size:12px; }
  header select { margin-left:auto; background:var(--panel); color:var(--text);
                  border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  header button { background:var(--panel); color:var(--text); border:1px solid var(--line);
                  border-radius:6px; padding:4px 10px; cursor:pointer; }
  main { flex:1; display:grid; grid-template-columns: 1fr 420px; min-height:0; }
  #chat { display:flex; flex-direction:column; min-width:0; }
  #messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:78%; border-radius:12px; padding:10px 12px; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .part-reasoning { color:var(--dim); font-style:italic; border-left:3px solid var(--line);
                    padding-left:8px; margin:6px 0; }
  .part-tool { border:1px solid var(--line); border-radius:8px; margin:8px 0; padding:8px;
               background:#10131a; font-size:13px; }
  .part-tool .head { display:flex; gap:8px; align-items:center; margin-bottom:4px; }
  .part-tool .name { font-weight:600; font-family:ui-monospace,monospace; }
  .badge { font-size:11px; border-radius:10px; padding:1px 8px; border:1px solid var(--line); color:var(--dim); }
  .badge.ok { color:var(--green); border-color:var(--green); }
  .badge.err, .badge.denied { color:var(--red); border-color:var(--red); }
  .badge.wait { color:var(--amber); border-color:var(--amber); }
  .part-tool pre { margin:4px 0 0; padding:6px; background:#0b0d12; border-radius:6px;
                   overflow-x:auto; font-size:12px; color:#c8d0e0; }
  .approve-row { margin-top:8px; display:flex; gap:8px; }
  .approve-row button { border:none; border-radius:6px; padding:5px 14px; cursor:pointer; font-weight:600; }
  .approve-row .yes { background:var(--green); color:#06281b; }
  .approve-row .no { background:var(--red); color:#fff; }
  .part-data { border:1px solid var(--accent); border-radius:8px; margin:8px 0; padding:8px 10px;
               background:#101725; }
  .part-data .label { font-size:11px; color:var(--accent); font-family:ui-monospace,monospace; }
  .weather { display:flex; gap:14px; align-items:center; font-size:15px; }
  .weather .t { font-size:26px; font-weight:700; }
  .part-error { color:var(--red); margin:6px 0; }
  .part-source a, .part-file a { color:var(--accent); }
  #composer { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  #composer input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--text);
                    border-radius:8px; padding:10px 12px; font-size:14px; }
  #composer button { background:var(--accent); border:none; color:#fff; border-radius:8px;
                     padding:0 18px; font-weight:600; cursor:pointer; }
  #composer button:disabled { opacity:.5; cursor:default; }
  #frames { border-left:1px solid var(--line); display:flex; flex-direction:column; min-width:0; }
  #frames h2 { font-size:12px; margin:0; padding:10px 12px; color:var(--dim); text-transform:uppercase;
               letter-spacing:.08em; border-bottom:1px solid var(--line); }
  #framelog { flex:1; overflow:auto; margin:0; padding:10px 12px; font:11px/1.6 ui-monospace,monospace;
              color:#9fb0cc; white-space:pre; }
  .suggest { display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 8px; }
  .suggest button { background:var(--panel); border:1px solid var(--line); color:var(--dim);
                    border-radius:14px; padding:3px 10px; font-size:12px; cursor:pointer; }
  @media (max-width:900px){ main{grid-template-columns:1fr} #frames{display:none} }
</style>
</head>
<body>
<header>
  <h1>ui-message-stream demo</h1>
  <span class="hint">left: rendered parts &middot; right: raw protocol frames</span>
  <select id="transport" title="Transport">
    <option value="/api/chat">reactive (Flux&lt;SSE&gt;)</option>
    <option value="/api/chat-mvc">servlet (SseEmitter)</option>
  </select>
  <button id="tour">protocol tour</button>
</header>

<main>
  <section id="chat">
    <div id="messages"></div>
    <div class="suggest">
      <button>weather in Samarkand</button>
      <button>what time is it</button>
      <button>transfer money</button>
      <button>please fail</button>
    </div>
    <form id="composer">
      <input id="input" placeholder="Try: weather in Samarkand &middot; transfer money &middot; please fail" autocomplete="off">
      <button id="send" type="submit">Send</button>
    </form>
  </section>
  <aside id="frames">
    <h2>SSE frames</h2>
    <pre id="framelog"></pre>
  </aside>
</main>

<script>
"use strict";
// ---- a miniature useChat: keeps messages in the AI SDK wire format and replays full history ----
const messages = [];   // [{id, role, parts:[...]}]
let busy = false;

const $messages = document.getElementById("messages");
const $framelog = document.getElementById("framelog");
const $input = document.getElementById("input");
const $send = document.getElementById("send");

document.getElementById("composer").addEventListener("submit", e => {
  e.preventDefault();
  const text = $input.value.trim();
  if (!text || busy) return;
  $input.value = "";
  messages.push({ id: "u_" + Date.now(), role: "user", parts: [{ type: "text", text }] });
  render();
  send();
});
document.querySelectorAll(".suggest button").forEach(b =>
  b.addEventListener("click", () => { $input.value = b.textContent; $input.focus(); }));
document.getElementById("tour").addEventListener("click", () => {
  if (!busy) stream(fetch("/api/protocol-tour"));
});

function send() {
  const url = document.getElementById("transport").value;
  stream(fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages })
  }));
}

async function stream(request) {
  busy = true; $send.disabled = true;
  let assistant = null;       // message being built
  let openPart = null;        // current text/reasoning part
  try {
    const res = await request;
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let i;
      while ((i = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, i); buffer = buffer.slice(i + 2);
        for (const line of block.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          logFrame(data);
          if (data === "[DONE]") continue;
          const r = onFrame(JSON.parse(data), assistant, openPart);
          assistant = r.assistant; openPart = r.openPart;
          render();
        }
      }
    }
  } catch (err) {
    logFrame("!! " + err);
  } finally {
    busy = false; $send.disabled = false;
  }
}

function onFrame(f, assistant, openPart) {
  switch (f.type) {
    case "start":
      assistant = { id: f.messageId || ("a_" + Date.now()), role: "assistant", parts: [] };
      messages.push(assistant);
      return { assistant, openPart: null };
    case "text-start":
      openPart = { type: "text", text: "" }; assistant.parts.push(openPart); break;
    case "text-delta":
      if (openPart) openPart.text += f.delta; break;
    case "reasoning-start":
      openPart = { type: "reasoning", text: "" }; assistant.parts.push(openPart); break;
    case "reasoning-delta":
      if (openPart) openPart.text += f.delta; break;
    case "text-end": case "reasoning-end":
      return { assistant, openPart: null };
    case "tool-input-available":
      assistant.parts.push({ type: "dynamic-tool", toolName: f.toolName, toolCallId: f.toolCallId,
                             state: "input-available", input: f.input });
      break;
    case "tool-output-available": {
      const p = findTool(f.toolCallId); if (p) { p.state = "output-available"; p.output = f.output; }
      break;
    }
    case "tool-output-error": {
      const p = findTool(f.toolCallId); if (p) { p.state = "output-error"; p.errorText = f.errorText; }
      break;
    }
    case "tool-approval-request": {
      const p = findTool(f.toolCallId);
      if (p) { p.state = "approval-requested"; p.approval = { id: f.approvalId }; }
      break;
    }
    case "tool-output-denied": {
      const p = findTool(f.toolCallId); if (p) p.state = "output-denied";
      break;
    }
    case "source-url":
      assistant.parts.push({ type: "source-url", url: f.url }); break;
    case "file":
      assistant.parts.push({ type: "file", url: f.url, mediaType: f.mediaType }); break;
    case "error":
      (assistant ?? lastAssistant()).parts.push({ type: "error", errorText: f.errorText }); break;
    default:
      if (f.type && f.type.startsWith("data-"))
        assistant.parts.push({ type: f.type, data: f.data });
  }
  return { assistant, openPart };
}

function findTool(toolCallId) {
  for (let m = messages.length - 1; m >= 0; m--)
    for (const p of messages[m].parts)
      if (p.toolCallId === toolCallId) return p;
  return null;
}
function lastAssistant() {
  for (let m = messages.length - 1; m >= 0; m--)
    if (messages[m].role === "assistant") return messages[m];
  const a = { id: "a_" + Date.now(), role: "assistant", parts: [] };
  messages.push(a); return a;
}

// ---- the human-in-the-loop round trip: record the decision on the part, replay full history ----
function decide(toolCallId, approved) {
  const p = findTool(toolCallId);
  if (!p || !p.approval) return;
  p.state = "approval-responded";
  p.approval.approved = approved;
  render();
  send();
}

// ---------------------------------- rendering ----------------------------------
function render() {
  $messages.innerHTML = "";
  for (const m of messages) {
    const div = document.createElement("div");
    div.className = "msg " + (m.role === "user" ? "user" : "assistant");
    for (const p of m.parts) div.appendChild(renderPart(p));
    $messages.appendChild(div);
  }
  $messages.scrollTop = $messages.scrollHeight;
}

function renderPart(p) {
  if (p.type === "text") return textNode(p.text);
  if (p.type === "reasoning") return el("div", "part-reasoning", p.text);
  if (p.type === "error") return el("div", "part-error", "error: " + p.errorText);
  if (p.type === "source-url") {
    const d = el("div", "part-source", "source: ");
    d.appendChild(link(p.url)); return d;
  }
  if (p.type === "file") {
    const d = el("div", "part-file", "file (" + p.mediaType + "): ");
    d.appendChild(link(p.url)); return d;
  }
  if (p.type === "data-weather-card") {
    const d = el("div", "part-data");
    d.appendChild(el("div", "label", "data-weather-card (pushed from inside the tool)"));
    const w = el("div", "weather");
    w.appendChild(el("span", "t", p.data.temperatureC + "°C"));
    w.appendChild(el("span", "", p.data.city + " — " + p.data.condition));
    d.appendChild(w); return d;
  }
  if (p.type.startsWith("data-")) {
    const d = el("div", "part-data");
    d.appendChild(el("div", "label", p.type));
    d.appendChild(pre(p.data)); return d;
  }
  if (p.type === "dynamic-tool") {
    const d = el("div", "part-tool");
    const head = el("div", "head");
    head.appendChild(el("span", "name", p.toolName));
    head.appendChild(el("span", "badge " + badgeClass(p.state), p.state));
    d.appendChild(head);
    d.appendChild(pre({ input: p.input }));
    if (p.output !== undefined) d.appendChild(pre({ output: p.output }));
    if (p.errorText) d.appendChild(el("div", "part-error", p.errorText));
    if (p.state === "approval-requested") {
      const row = el("div", "approve-row");
      const yes = el("button", "yes", "Approve"); yes.onclick = () => decide(p.toolCallId, true);
      const no = el("button", "no", "Deny");      no.onclick = () => decide(p.toolCallId, false);
      row.appendChild(yes); row.appendChild(no); d.appendChild(row);
    }
    return d;
  }
  return textNode("");
}

const badgeClass = s => ({ "output-available": "ok", "output-error": "err",
  "output-denied": "denied", "approval-requested": "wait" })[s] || "";
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text; return e; }
function textNode(t) { const s = document.createElement("span"); s.textContent = t; return s; }
function link(url) { const a = document.createElement("a"); a.href = url; a.target = "_blank";
  a.textContent = url; return a; }
function pre(obj) { const e = document.createElement("pre");
  e.textContent = JSON.stringify(obj, null, 2); return e; }
function logFrame(s) { $framelog.textContent += s + "\n"; $framelog.scrollTop = $framelog.scrollHeight; }
</script>
</body>
</html>
