# JitPack build configuration — https://docs.jitpack.io/building/
#
# This library targets Java 25, which JitPack's default build image does not ship.
# JitPack provisions OpenJDK 25 through its standard JDK setting. The install step restores the
# Maven wrapper's executable bit, then runs the
# Maven build (`./mvnw clean install`) — `clean` keeps the published artifact set reproducible.
#
# Why `chmod +x mvnw`: this repo is committed from Windows, which does not preserve the Unix
# executable bit, so JitPack's Linux build image otherwise fails at `./mvnw` with
# "Permission denied" (exit 126). A permanent alternative is to set the bit in git itself:
# `git update-index --chmod=+x mvnw` (then commit) — doing both is harmless.
jdk:
  - openjdk25

install:
  - chmod +x mvnw
  - ./mvnw clean install -DskipTests
